[build]
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NETLIFY = "true"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  NEXT_DISABLE_ESLINT = "1"
  DISABLE_ESLINT_PLUGIN = "true"
  NODE_ENV = "production"
  API_URL = "https://fitpro-backend.onrender.com"
  NEXT_PUBLIC_API_URL = "https://fitpro-backend.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Handle API requests
[[redirects]]
  from = "/api/*"
  to = "https://fitpro-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  # Increase the build timeout to 60 seconds
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/plugin-nextjs"]

[build.processing]
  skip_processing = true

[dev]
  framework = "next"
  targetPort = 3000 